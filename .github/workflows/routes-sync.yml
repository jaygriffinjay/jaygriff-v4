name: Sync routes to goatboat

# Tells goatboat which code pages exist whenever pages change on main
on:
  push:
    branches: [main]
    paths: ["src/app/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routes-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The sync reads each page's headings with the TypeScript parser
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Get goatboat sync token
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            57b21685-0fbd-4cc1-8776-b4e400615696 > GOATBOAT_SYNC_TOKEN

      - name: Sync routes
        run: node scripts/routes-sync.mts
        env:
          GOATBOAT_URL: https://goatboat-henna.vercel.app
